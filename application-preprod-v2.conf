# Bifrost Bridge v2 — Cardano preprod + Bitcoin testnet4.
#
# A SECOND, independent bridge beside the 2026-07-17 deployment in application-preprod.conf.
# That file and its `binocular-watchtower` service are the working demo and are NOT touched.
#
# What v2 shares with v1:
#   - the Binocular oracle, verbatim (tx-out-ref 1c8cb02d…#0, policy 83d66490…). v2 only READS it:
#     the oracle sync daemon (`run`) is not part of this deployment, dev.lantr.io's v1 watchtower
#     owns block submission.
#   - the box's bitcoind testnet4 (127.0.0.1:48332) and Dolos mini-Blockfrost (127.0.0.1:3000).
#   - the sponsor wallet (WALLET_MNEMONIC).
#
# What it does not share: everything on-chain. The TM validator is parameterized by
# (oracle hash, config NFT policy, config NFT asset) and v2 mints its own config NFT, so the two
# bridges have different TM addresses and cannot see each other's movements.
#
# Processes: `relay` and `confirm-tmtx` as two systemd units (deploy/nixos/binocular-bridge-v2.nix).
# NOT `watchtower` — that command always starts the oracle worker as well.
#
# ── What an SPO puts in heimdall.toml to join THIS bridge ────────────────────────────────────
# Three values are the whole bridge configuration; everything else is read from the Config datum.
#   [cardano]
#   config_nft_policy_id  = "d8c06b705b0089b8da32e1a17550bc0d3a4fea7999508e3e95669d10"
#   config_nft_asset_name = "424946434647"
#   config_address        = "addr_test1wrvvq6mstvqgnwx6xts6za2shsxn5nl20xv4pr37j4nf6yqgpyh9f"
#   # Reproduces the federation SCRIPTS (the published policy ids identify their UTxOs but cannot
#   # rebuild them). Note the ':' spelling — heimdall's, not binocular's '#'.
#   registry_bootstrap = treasury_bootstrap =
#     "1f43b957d091a0f822c190d63e5ab8399608b554cd17e15428e44581b43c1aa8:0"
#
# Addresses this deploy created, for reference:
#   TM validator      addr_test1... (policy f691433e0f802c0f7bc4ca72a66c801b016eda13995cc8e8c9e48ad3)
#   peg-in script     addr_test1wrxw3hx8h4lye7g8pn03u8rdgmaeazjryvngepcrtnpaf6gh6jprx
#   peg-out script    addr_test1wr74gvdtv9exe4psnpy2602py8kz7yuvzdw7gng4xgkr3aq8wju9e
#   completed peg-ins addr_test1wp5s5czursma8r92h6csjays8npjlm8548fsf08cmgmmdrg96254x
#   bridge state      addr_test1wzvylky82frs8520e08g2cwlvgtkg5a0w0kuhcwuuvw5ysss9qskr
#   treasury_info     addr_test1wzpn6y09rc2cdy3mdl9r00ceklcu0ckvjj4yvltm37a6ptqtv4fxh
#   spos_registry     addr_test1wp09r3zjjpf3lwlu470gukl0aq3ugzzexgymtlgpvk9fwmgz3ju4p
#   spo_bans          addr_test1wr5k9tf3eyf4wrfjvgwk982af7v3g0ju28ygvre944742rqjngs4h
#   BTC treasury      tb1pzsjcjxntl8jsegdf5nacsumm64tnmldef9cst9p833qw2kuwvn5quw9xyc
binocular {
  bitcoin-node {
    url = "http://127.0.0.1:48332/"
    username = "bitcoin"
    password = "bitcoin"
    network = "testnet4"
  }

  cardano {
    network = "preprod"
    backend = "blockfrost"
    blockfrost-project-id = ${?BLOCKFROST_PROJECT_ID}
    # Self-hosted Dolos (deploy/nixos/dolos.nix). With this set, blockfrost-project-id is not
    # required — Dolos ignores the header.
    #
    # SUBMISSION CAVEAT (2026-08-14). Dolos rejected a plain 574-byte pay-to-self transaction with
    # `ValidationError(,None)` and no log line, while fully synced (identical tip to blockfrost.io);
    # hosted Blockfrost accepted the SAME bytes — same tx hash — and it confirmed. Reads are
    # unaffected, and v1's watchtower does submit through Dolos, so this is not a blanket failure.
    # The escape hatch is this env override: BLOCKFROST_URL=https://cardano-preprod.blockfrost.io/api/v0
    # sends both reads and submissions to the hosted backend. Genesis was run that way.
    blockfrost-url = "http://127.0.0.1:3000"
    blockfrost-url = ${?BLOCKFROST_URL}
  }

  wallet {
    mnemonic = ${?WALLET_MNEMONIC}
  }

  notifications {
    enabled = true
    discord-webhook-url = ${?BIFROST_DISCORD_WEBHOOK}
    throttle-interval-seconds = 3600
    throttle-interval-seconds = ${?BIFROST_NOTIFICATIONS_THROTTLE_SECONDS}
    error-mention-user-id = ${?BIFROST_DISCORD_MENTION_USER_ID}
  }

  relay {
    # Relay + confirm-tmtx poll every 10 minutes: new TMs and oracle promotions arrive on
    # Bitcoin-block timescales, so second-level polling only burns Blockfrost requests.
    poll-interval = 600
    retry-interval = 60
    # Empty: v1's two dead TMs (aa9f3a2f…, b7d6b5c8…) belong to v1's TM address, which v2 never
    # scans. A fresh bridge starts with no dead movements.
    skip-btc-txids = []
  }

  # The LIVE oracle, copied from application-preprod.conf. v2 is a reader: the oracle sync daemon
  # is not started here, so none of these values authorize a write. They still matter, because the
  # oracle policy id is a compile-time parameter of the TM validator and of peg_in — a wrong one
  # derives a different bridge.
  oracle {
    tx-out-ref = "1c8cb02dd6201c9eb765efab5aa9f78c0f4cea0bd533a923c83d1a6fc6ea9a43#0"
    script-hash = "83d66490b8660a266fb663c3362a2ad0da3cb5ad339036305045bb3c"
    owner-pkh = "9c87f0a90fcedee0a3b0fbbb6102c8e504b7e0459cf01ee4a31d63ac"
    challenge-aging = 3600
    maturation-confirmations = 12
    start-height = 136600
    max-headers-per-tx = 40
    closure-timeout = 600
    # OFF, unlike v1. auto-reset submits an owner SetState against the SHARED oracle UTxO. Only
    # one process may ever do that, and on this box it is v1's watchtower. Read by the `run`
    # daemon alone, which v2 does not start — this is belt and braces.
    auto-reset = false
  }

  bridge {
    # Empty on purpose: BifrostBlueprint.resolve falls back to the blueprint vendored in the jar
    # (/bifrost-plutus-min.json), verified identical to ft-bifrost-bridge/onchain/plutus.json for
    # all 13 validators. dev.lantr.io has no ft checkout, so a path here would silently resolve to
    # the packaged copy anyway; saying so is clearer than a path that does not exist.
    plutus-json = ""

    # --- genesis inputs, fixed before deploy-bridge ---
    # Config #11. The 2-of-3 `heimdall federation-dkg` group key (federation_setup_Y), formed
    # 2026-08-14 by three members on dev.lantr.io (/var/lib/heimdall-fed{1,2,3}, ports
    # 18511-18513; roster digest 97aa6dd3fddb3eba). All three derived this key and this treasury
    # address independently:
    #   tb1pzsjcjxntl8jsegdf5nacsumm64tnmldef9cst9p833qw2kuwvn5quw9xyc
    # It is an input to that address, so a wrong value here derives a well-formed address that
    # holds nothing. The shares are federation-key.json in each member's dir, 0600, and a re-run
    # of the ceremony produces a DIFFERENT key.
    y-federation-hex = "8b4e2c88686bb5aa201171cb9c6e174dba6dfd48862c42b1bf0972e2c789e957"
    # params[7]: the CSV delay of the treasury's federation recovery leaf. MUST equal
    # bitcoin.federation_csv_blocks in every member's heimdall TOML.
    federation-csv-blocks = 144
    # params[8]: the CSV delay of the peg-in tree's depositor refund leaf. Must exceed the above.
    pegin-refund-timeout-blocks = 720
    # The deployment anchor written into the bridge-state singleton's bootstrap BridgeState.
    # The vout MUST be 0 — BridgeState.treasuryUtxoId is txid ‖ vout LE with the vout fixed at
    # 00000000, and the next TM must spend this outpoint as its input 0.
    # deploy-bridge verifies both values with gettxout ([DEP-2]) before writing them.
    initial-btc-treasury-utxo = "f798ba989b11a0692a1ffb889018abb41deefe34acc335c29e4752fb12652c7f:0"
    initial-btc-treasury-amount-sat = 300000

    # --- operational parameters baked into the config datum at deploy time ---
    fee-rate-sat-per-vb = 1
    per-pegout-fee-sat = 1000
    min-peg-out-sat = 10000
    # Inputs to the spo_bans POLICY ID, not governance-updatable in place. Preprod values.
    ban-schedule {
      base-ban-duration-ms = 600000
      max-faults-before-permanent = 3
      max-validity-window-ms = 3600000
    }
    # How long a pegin-request mint stays submittable. An hour is right on a public network.
    pegin-request-ttl-seconds = 3600

    # --- bridge identity, written back from deploy-bridge (2026-08-14) ---
    # Genesis ran in two transactions, federation first, on purpose: the Config NFT is the bridge's
    # identity, so minting the registry and ban roots BEFORE it makes "a bridge cannot exist
    # without a ban list" true by construction.
    #   federation tx  1316559b5c3a1542de7661c3bed4977f41fd35397fce9d115e9d1c43ba8651a4
    #   bootstrap tx   e1a0ef56cf9581b9077dafcc89029df94413fd4b3ce5ddb49a20e4a9f532895e
    config-nft-policy-id = "d8c06b705b0089b8da32e1a17550bc0d3a4fea7999508e3e95669d10"
    config-nft-asset-name = "424946434647"
    bridged-token-policy-id = "bb9cdebafaec99204e6ac1378c4e67f2a38ffcd5955c82774eb9e7e6"
    bridged-token-asset-name = "66534154"
    # Both keys are the SAME outpoint: config, cpi and bridge-state were minted by one tx that
    # spent one one-shot, so each policy is parameterized by it.
    completed-peg-ins-one-shot-ref = "1f43b957d091a0f822c190d63e5ab8399608b554cd17e15428e44581b43c1aa8#1"
    bridge-state-one-shot-ref = "1f43b957d091a0f822c190d63e5ab8399608b554cd17e15428e44581b43c1aa8#1"
    # The federation half's one-shot, spent by the federation tx. Still the INPUT that reproduces
    # treasury_info, spos_registry and spo_bans, which their published policy ids cannot.
    federation-one-shot-ref = "1f43b957d091a0f822c190d63e5ab8399608b554cd17e15428e44581b43c1aa8#0"

    # --- local state ---
    # Its own directory. v1's cpo-trie.json mirrors v1's completed-peg-outs root; sharing one file
    # between two bridges would make the sweeper reconcile against the wrong root and HALT.
    state-dir = "/var/lib/binocular-v2"
    # ON, and served by its OWN unit: only the `watchtower` command starts the proof server
    # in-process, and v2 runs relay + confirm-tmtx instead, so binocular-bridge-v2-proofs runs
    # `serve-proofs` as a third service. This flag is what that command reads for its port.
    #
    # 9061, NOT the 9060 of reference.conf. v1's application-preprod.conf has no `bridge` override
    # at all, so `proof-server = true` and `proof-server-port = 9060` are its defaults — the moment
    # v1's jar is rebuilt from a commit carrying ProofServer, its watchtower binds 9060 in-process.
    # Leaving v2 there would make the collision a coin toss decided by service start order.
    #
    # ProofServer binds 0.0.0.0 hardcoded (ProofServer.scala:73), so this port MUST stay out of
    # networking.firewall.allowedTCPPorts. Caddy reaches it over loopback, which is not filtered.
    proof-server = true
    proof-server-port = 9061
  }
}
