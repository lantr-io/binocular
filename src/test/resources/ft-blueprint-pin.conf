# Cross-repo drift record for ft-bifrost-bridge's Aiken blueprint.
#
# src/main/resources/bifrost-plutus-min.json is a hand-vendored copy of ft's onchain/plutus.json.
# Nothing in binocular's build regenerates it, and the policy-id pins in BifrostContractsTest are
# computed FROM that copy, so they lock it against itself. This file is the only committed evidence
# of which ft build the copy was cut from.
#
# Read by BifrostBlueprintSourceTest:
#   - always: the per-title digests below must match the vendored copy, so re-vendoring without
#     refreshing this file fails the build;
#   - when an ft checkout is present (or BIFROST_PLUTUS_JSON is set): plutus-json-sha256 must match
#     ft's onchain/plutus.json byte for byte.
#
# Refresh procedure, all in ONE commit: copy the compiledCode fields across into
# bifrost-plutus-min.json, update every digest here, and move the affected pins in
# BifrostContractsTest.

# `shasum -a 256 <ft>/onchain/plutus.json` — the whole file, including titles and schemas, so a
# regeneration that changes nothing binocular tracks still shows up as a deliberate refresh.
plutus-json-sha256 = "dd84e77f8bc2933d898c4fd26831cf1b4649d7e13cc7f52496d86fff9f97244e"

# sha256 of each validator's `compiledCode` HEX STRING, taken as ASCII bytes (not of the decoded
# script). Titles are HOCON-quoted so the dots are not read as path separators.
compiled-code-sha256 {
  "bitcoin/config.config.mint" = "a9fe6177d8dbfc662546753f04cd71997945e3046462df68bbe3c323b414b470"
  "bitcoin/bridged_token.bridged_token.mint" = "37a5c66624f116242f7f11e48cca209f58c2e78aa5b42965dc0556aa77569ec1"
  "bitcoin/completed_peg_ins_merkle_tree.completed_peg_ins_merkle_tree_validator.mint" = "b4f8b4c12b798a4c436b675acdda87fa4b73b478b32ca3400b5428ab7b76070e"
  "bitcoin/completed_peg_outs_merkle_tree.completed_peg_outs_merkle_tree_validator.mint" = "5299a4c274caf9fe34984a98028540b124904557b9c2f89e4ed4c84c67abcac9"
  "bitcoin/peg_in.peg_in_validator.mint" = "05272a4cc014e3ef0806a91404f97ed12a6fa03e0b47a46f5abf9606be0f16bf"
  "bitcoin/peg_out.peg_out_validator.withdraw" = "ad700916703a4b064147a5455a68b67f7f7a51e40577cc7280da2baef1f91efc"
}
