binocular {
  bitcoin-node {
    url = ""
    url = ${?bitcoind_rpc_url}
    url = ${?BITCOIN_NODE_URL}
    username = ""
    username = ${?bitcoind_rpc_user}
    username = ${?BITCOIN_NODE_USER}
    password = ""
    password = ${?bitcoind_rpc_password}
    password = ${?BITCOIN_NODE_PASSWORD}
    network = "mainnet"
    network = ${?BITCOIN_NETWORK}
  }

  cardano {
    network = "mainnet"
    network = ${?CARDANO_NETWORK}
    backend = "blockfrost"
    backend = ${?CARDANO_BACKEND}
    blockfrost-project-id = ""
    blockfrost-project-id = ${?BLOCKFROST_PROJECT_ID}
    yaci-store-url = "http://localhost:8080/api/v1"
    yaci-store-url = ${?YACI_STORE_URL}
    yaci-admin-url = "http://localhost:10000/local-cluster/api"
    yaci-admin-url = ${?YACI_ADMIN_URL}
  }

  wallet {
    mnemonic = ""
    mnemonic = ${?WALLET_MNEMONIC}
  }

  relay {
    tmtx-policy-id = "eafdc4d9733275d3e06cfe5fe54a13fff3ba5baa8d65636260537907"
    tmtx-policy-id = ${?RELAY_TMTX_POLICY_ID}
    tmtx-asset-name = "TMTx"
    tmtx-asset-name = ${?RELAY_TMTX_ASSET_NAME}
    poll-interval = 5
    poll-interval = ${?RELAY_POLL_INTERVAL}
    retry-interval = 10
    retry-interval = ${?RELAY_RETRY_INTERVAL}
    # BTC txids (big-endian hex) of Unconfirmed TM UTxOs confirm-tmtx must skip (permanently-dead
    # TMs whose signed BTC tx can never be mined). Empty by default.
    skip-btc-txids = []
  }

  bridge {
    plutus-json = "../../FluidTokens/ft-bifrost-bridge/onchain/plutus.json"
    plutus-json = ${?BIFROST_PLUTUS_JSON}
    config-nft-policy-id = "00000000000000000000000000000000000000000000000000000000"
    config-nft-policy-id = ${?CONFIG_NFT_POLICY_ID}
    config-nft-asset-name = ""
    config-nft-asset-name = ${?CONFIG_NFT_ASSET_NAME}
    bridged-token-policy-id = "00000000000000000000000000000000000000000000000000000000"
    bridged-token-policy-id = ${?BRIDGED_TOKEN_POLICY_ID}
    bridged-token-asset-name = "66534154"
    bridged-token-asset-name = ${?BRIDGED_TOKEN_ASSET_NAME}
    completed-peg-ins-one-shot-ref = ""
    completed-peg-ins-one-shot-ref = ${?COMPLETED_PEG_INS_ONE_SHOT_REF}
    # The outpoint (TX_HASH#INDEX) consumed when the completed-peg-outs (CPO) singleton was minted
    # at deploy-bridge. It parameterizes the CPO trie validator, so `confirm-tmtx` — and therefore
    # the `watchtower` daemon — cannot rebuild the trie spend without it and EXITS AT STARTUP when
    # it is missing. Every deployment must set it, including a peg-in-only one.
    # Deliberately has NO default: BridgeConfig.completedPegOutsOneShotRef is Option[String], and a
    # `completed-peg-outs-one-shot-ref = ""` line here reads back as Some("") rather than None,
    # turning "absent" into "present but empty". The env line below is a no-op while the var is
    # unset, so the key stays absent unless someone actually sets it.
    # completed-peg-outs-one-shot-ref = "TX_HASH#INDEX"
    completed-peg-outs-one-shot-ref = ${?COMPLETED_PEG_OUTS_ONE_SHOT_REF}
    # The outpoint (TX_HASH#INDEX) consumed when the bridge-state singleton ("BSS") was minted.
    # It parameterizes the bridge_state validator, so `confirm-tmtx` — and therefore the
    # `watchtower` daemon — cannot rebuild the singleton spend without it and EXITS AT STARTUP
    # when it is missing. No default, for the same Some("")-vs-None reason as the key above.
    # bridge-state-one-shot-ref = "TX_HASH#INDEX"
    bridge-state-one-shot-ref = ${?BRIDGE_STATE_ONE_SHOT_REF}
    initial-btc-treasury-utxo = ""
    initial-btc-treasury-utxo = ${?INITIAL_BTC_TREASURY_UTXO}
    # Config #9, the DKG candidate-set stake threshold (lovelace), written at deploy. 0 = no
    # threshold. On a DEPLOYED bridge this is governance's to change — `update-config --min-stake`
    # — not each SPO's: heimdall's registration gate reads the on-chain value.
    min-stake-lovelace = 0
    min-stake-lovelace = ${?BRIDGE_MIN_STAKE_LOVELACE}
    # Operational parameters BAKED INTO the on-chain config datum (fields 12–15) at deploy-bridge
    # time. A wrong value here ships a wrong on-chain parameter that only a governance Update can
    # fix. Listed with their real defaults: BridgeConfig carries the same numbers, so an omitted
    # key used to be indistinguishable from a deliberate one.
    # #12: Bitcoin fee rate the TM builder charges, in sat/vB.
    fee-rate-sat-per-vb = 1
    fee-rate-sat-per-vb = ${?BIFROST_FEE_RATE_SAT_PER_VB}
    # #13: flat per-peg-out fee in satoshis, subtracted from each peg-out payment.
    per-pegout-fee-sat = 1000
    per-pegout-fee-sat = ${?BIFROST_PER_PEGOUT_FEE_SAT}
    # #14: smallest peg-out the bridge accepts, in satoshis (= fBTC).
    min-peg-out-sat = 10000
    min-peg-out-sat = ${?BIFROST_MIN_PEG_OUT_SAT}
    # The spo_bans ban schedule, fixed at genesis and published verbatim as config #8-10.
    # UNLIKE the tunables above, these are NOT governance-updatable in place: they are INPUTS to
    # the spo_bans policy id, so changing one names a different ban list — a different address,
    # holding nothing. They are chosen once here and then read by every SPO rather than typed by
    # each. Defaults are the preprod values.
    ban-schedule {
      # nth ban lasts base * 2^(n-1).
      base-ban-duration-ms = 600000
      base-ban-duration-ms = ${?BIFROST_BASE_BAN_DURATION_MS}
      # fault count at which a pool is banned permanently.
      max-faults-before-permanent = 3
      max-faults-before-permanent = ${?BIFROST_MAX_FAULTS_BEFORE_PERMANENT}
      # upper bound on an ApplyBan tx's validity interval.
      max-validity-window-ms = 3600000
      max-validity-window-ms = ${?BIFROST_MAX_VALIDITY_WINDOW_MS}
    }
    # POR sweeper (spec rev 5.2): after each confirmed TM, complete every PAID PegOutRequest —
    # burn its locked fBTC against a membership proof and keep its MIN_ADA. Permissionless
    # cleanup that pays for itself; off only for a confirm-but-never-spend watchtower.
    por-sweeper = true
    por-sweeper = ${?BIFROST_POR_SWEEPER}
    # Seconds between IDLE sweeps. A sweep always runs right after a confirm; this only governs
    # picking up requests paid by a TM someone else confirmed.
    por-sweep-interval-seconds = 300
    por-sweep-interval-seconds = ${?BIFROST_POR_SWEEP_INTERVAL}
    # Directory for the persistent completed-peg-outs trie mirror (cpo-trie.json).
    state-dir = ".binocular"
    state-dir = ${?BIFROST_STATE_DIR}
  }

  notifications {
    enabled = true
    enabled = ${?BIFROST_NOTIFICATIONS_ENABLED}
    # Discord incoming-webhook URL. Secret — supply via the BIFROST_DISCORD_WEBHOOK env var
    # (secrets.env on the box / .env locally). Empty => notifications disabled (NoopNotifier).
    discord-webhook-url = ""
    discord-webhook-url = ${?BIFROST_DISCORD_WEBHOOK}
    # Max one block-summary and one success notification per this many seconds (default 1h). Bursty
    # block/success events inside the window are coalesced into a single message; errors are never
    # throttled.
    throttle-interval-seconds = 3600
    throttle-interval-seconds = ${?BIFROST_NOTIFICATIONS_THROTTLE_SECONDS}
    # Numeric Discord user ID to @-mention (a real ping) on error notifications. Not secret, but
    # env-overridable. Empty => errors post without a ping.
    error-mention-user-id = ""
    error-mention-user-id = ${?BIFROST_DISCORD_MENTION_USER_ID}
  }

  oracle {
    tx-out-ref = ""
    tx-out-ref = ${?ORACLE_TX_OUT_REF}
    # Expected hash of the parameterized oracle validator (28-byte hex). Verified at startup
    # against the hash derived from tx-out-ref, owner-pkh, the other oracle params, and the
    # compiled validator code; the daemon and on-chain commands fail fast on mismatch. Empty
    # skips the check. Bootstrap: set tx-out-ref, run `info` to get the derived hash, paste it
    # here, then `init`.
    script-hash = ""
    script-hash = ${?ORACLE_SCRIPT_HASH}
    owner-pkh = ""
    owner-pkh = ${?ORACLE_OWNER_PKH}
    start-height = null
    start-height = ${?ORACLE_START_HEIGHT}
    max-headers-per-tx = 10
    max-headers-per-tx = ${?ORACLE_MAX_HEADERS_PER_TX}
    poll-interval = 1
    poll-interval = ${?ORACLE_POLL_INTERVAL}
    retry-interval = 10
    retry-interval = ${?ORACLE_RETRY_INTERVAL}
    transaction-timeout = 120
    transaction-timeout = ${?ORACLE_TRANSACTION_TIMEOUT}
    maturation-confirmations = 100
    maturation-confirmations = ${?ORACLE_MATURATION_CONFIRMATIONS}
    challenge-aging = 12000
    challenge-aging = ${?ORACLE_CHALLENGE_AGING}
    closure-timeout = 2592000
    closure-timeout = ${?ORACLE_CLOSURE_TIMEOUT}
    max-blocks-in-fork-tree = 256
    max-blocks-in-fork-tree = ${?ORACLE_MAX_BLOCKS_IN_FORK_TREE}
    testing-mode = false
    testing-mode = ${?ORACLE_TESTING_MODE}
    # Automatically recover from a deep reorg by submitting an owner SetState once the oracle
    # satisfies the on-chain staleness gate (closure-timeout). Requires the daemon wallet to be
    # the oracle owner. When false (default), the watchtower alerts and stops for manual
    # recovery instead.
    auto-reset = false
    auto-reset = ${?ORACLE_AUTO_RESET}
    # Blocks below the Bitcoin tip to anchor the auto-reset at (H = tip - depth).
    # Defaults to maturation-confirmations when unset.
    auto-reset-depth = null
    auto-reset-depth = ${?ORACLE_AUTO_RESET_DEPTH}
  }
}
